[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amir-job-finder"
version = "0.2.0"
description = "Локальный автономный помощник hh.ru с ограниченным browser session bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amir Ismagilov" }]
dependencies = []

[project.scripts]
job-finder = "job_finder.cli:main"
job-finder-mcp = "job_finder.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
