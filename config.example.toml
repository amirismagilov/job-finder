[profile]
# Эти файлы остаются вне репозитория. MCP читает только релевантные фрагменты.
knowledge_paths = [
  "/absolute/path/to/baza_znaniy_opyt.md",
  "/absolute/path/to/baza_keysov_interview.md",
]
cover_letter_rules_path = "/absolute/path/to/pamyatka_soprovoditelnye.md"

[search]
area = "1"
days = 14
per_query = 10
queries = [
  "Руководитель AI проектов",
  "AI Product Manager",
  "Руководитель ИТ-проектов GenAI",
  "Delivery Manager",
  "Product Owner FinTech",
  "Консультант цифровая трансформация AI",
]
# Эти списки расширяют встроенные обязательные исключения, но не могут отключить их.
excluded_employer_terms = ["сбер", "sber", "яндекс", "yandex"]
excluded_industry_terms = [
  "букмекер", "беттинг", "bookmaker", "betting", "gambling", "igaming", "казино",
  "ставки на спорт", "азартные игры", "sportsbook",
  "fonbet", "фонбет", "betboom", "бетбум", "winline", "винлайн",
  "лига ставок", "pari", "parimatch", "париматч", "1xbet", "1xставка",
  "betcity", "бетсити", "olimpbet", "олимпбет", "marathonbet",
  "melbet", "мелбет", "mostbet", "мостбет", "tennisi", "тенниси",
  "baltbet", "балтбет", "legalbet",
]

[safety]
daily_application_limit = 5
daily_message_limit = 20
minimum_read_interval_seconds = 1.0
minimum_write_interval_seconds = 30.0

[hh]
base_url = "https://hh.ru"
chat_base_url = "https://chatik.hh.ru"
user_agent = "amir-job-finder/0.2 (local browser bridge)"

[bridge]
host = "127.0.0.1"
port = 8766
command_timeout_seconds = 45
max_request_bytes = 1100000
max_response_bytes = 1000000

[llm]
# Provider-neutral HTTP mode. HTTP разрешён только для loopback; удалённый endpoint обязан использовать HTTPS.
provider = "http"
endpoint = "http://127.0.0.1:11434/v1/chat/completions"
model = "local-model"
# Опционально для reasoning-моделей: none, low, medium, high, xhigh или max.
# Если параметр не задан, сохраняется совместимый с локальными провайдерами режим temperature=0.1.
# reasoning_effort = "xhigh"
timeout_seconds = 60
minimum_confidence = 0.75

# Альтернатива без Platform API key: замените секцию выше следующими значениями.
# provider = "codex_cli"
# codex_executable = "/absolute/path/to/codex"
# model = "gpt-5.6-sol"
# reasoning_effort = "xhigh"
# timeout_seconds = 300

[autonomy]
relevance_threshold = 75
max_vacancies_per_cycle = 12
chat_history_limit = 30
cycle_interval_seconds = 300
